<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Milena's Portfolio</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0f0f13; color: #e8e8f0; min-height: 100vh; }

    /* ── Login ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #1a1a24; border: 1px solid #2e2e40; border-radius: 16px;
      padding: 48px 40px; width: 360px; text-align: center;
    }
    .login-box h1 { font-size: 1.4rem; margin-bottom: 8px; color: #fff; }
    .login-box p  { font-size: .85rem; color: #888; margin-bottom: 28px; }
    .login-box input {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      border: 1px solid #2e2e40; background: #0f0f13; color: #e8e8f0;
      font-size: .95rem; margin-bottom: 12px; outline: none;
    }
    .login-box input:focus { border-color: #7c6fcd; }
    .login-box button {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: #7c6fcd; color: #fff; font-size: .95rem; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .login-box button:hover { background: #6a5ebd; }
    #login-error { color: #e07070; font-size: .82rem; margin-top: 10px; min-height: 18px; }

    /* ── Admin UI ── */
    #admin-ui { display: none; height: 100vh; flex-direction: column; }

    header {
      background: #1a1a24; border-bottom: 1px solid #2e2e40;
      padding: 14px 24px; display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: #fff; flex: 1; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf7d;
                  box-shadow: 0 0 6px #4caf7d; flex-shrink: 0; }
    #status-text { font-size: .8rem; color: #888; }

    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar: conversations ── */
    .sidebar {
      width: 300px; flex-shrink: 0; background: #14141e;
      border-right: 1px solid #2e2e40; display: flex; flex-direction: column;
    }
    .sidebar-title {
      padding: 16px 20px; font-size: .75rem; font-weight: 600;
      color: #666; text-transform: uppercase; letter-spacing: .08em;
      border-bottom: 1px solid #2e2e40;
    }
    #conversation-list { overflow-y: auto; flex: 1; }
    .conv-item {
      padding: 14px 20px; cursor: pointer; border-bottom: 1px solid #1e1e2e;
      transition: background .15s; position: relative;
    }
    .conv-item:hover { background: #1e1e2e; }
    .conv-item.active { background: #23233a; border-left: 3px solid #7c6fcd; }
    .conv-item.unread::after {
      content: ''; position: absolute; top: 16px; right: 16px;
      width: 8px; height: 8px; border-radius: 50%; background: #7c6fcd;
    }
    .conv-name { font-size: .9rem; font-weight: 600; color: #e8e8f0; margin-bottom: 3px; }
    .conv-preview { font-size: .78rem; color: #666; white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .conv-time { font-size: .72rem; color: #555; margin-top: 3px; }
    .empty-state { padding: 32px 20px; text-align: center; color: #555; font-size: .85rem; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header-bar {
      padding: 16px 24px; border-bottom: 1px solid #2e2e40;
      background: #1a1a24; flex-shrink: 0;
    }
    .chat-header-bar h2 { font-size: .95rem; color: #fff; }
    .chat-header-bar p  { font-size: .78rem; color: #666; margin-top: 2px; }

    #messages-area {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg-bubble {
      max-width: 72%; padding: 12px 16px; border-radius: 14px;
      font-size: .88rem; line-height: 1.5; position: relative;
    }
    .msg-bubble.visitor {
      background: #1e1e2e; color: #d8d8f0; border-bottom-left-radius: 4px;
      align-self: flex-start;
    }
    .msg-bubble.me {
      background: #7c6fcd; color: #fff; border-bottom-right-radius: 4px;
      align-self: flex-end;
    }
    .msg-meta { font-size: .7rem; opacity: .55; margin-top: 5px; }

    .no-chat-selected {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #444; font-size: .9rem;
    }

    /* ── Reply bar ── */
    .reply-bar {
      padding: 16px 24px; border-top: 1px solid #2e2e40;
      background: #1a1a24; display: flex; gap: 12px; flex-shrink: 0;
    }
    #reply-input {
      flex: 1; background: #0f0f13; border: 1px solid #2e2e40; border-radius: 10px;
      color: #e8e8f0; padding: 12px 16px; font-size: .88rem; resize: none;
      font-family: inherit; outline: none; max-height: 120px;
    }
    #reply-input:focus { border-color: #7c6fcd; }
    #reply-btn {
      background: #7c6fcd; border: none; border-radius: 10px; color: #fff;
      padding: 0 20px; font-size: .88rem; font-weight: 600; cursor: pointer;
      transition: background .2s; flex-shrink: 0;
    }
    #reply-btn:hover { background: #6a5ebd; }
    #reply-btn:disabled { background: #3a3a50; cursor: default; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #23233a;
      border: 1px solid #2e2e40; border-radius: 10px; padding: 12px 20px;
      font-size: .82rem; color: #e8e8f0; opacity: 0; transition: opacity .3s;
      pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; }
    .toast.error { border-color: #e07070; color: #e07070; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>Admin Panel</h1>
    <p>Milena's Portfolio — Live Messages</p>
    <input id="pw-input" type="password" placeholder="Password" autofocus />
    <button id="pw-btn">Sign In</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ADMIN UI -->
<div id="admin-ui">
  <header>
    <div class="status-dot" id="conn-dot"></div>
    <h1>Live Messages</h1>
    <span id="status-text">Connecting…</span>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-title">Conversations</div>
      <div id="conversation-list">
        <div class="empty-state">No messages yet.<br>They'll appear here in real time.</div>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="no-chat-selected" id="no-chat">
        ← Select a conversation to reply
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Login ──
  const ADMIN_PASSWORD = '{{ admin_password }}';
  const pwInput = document.getElementById('pw-input');
  const pwBtn   = document.getElementById('pw-btn');
  const loginErr = document.getElementById('login-error');

  function tryLogin() {
    if (pwInput.value === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-ui').style.display = 'flex';
      initAdmin();
    } else {
      loginErr.textContent = 'Wrong password.';
      pwInput.value = '';
      pwInput.focus();
    }
  }
  pwBtn.addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  // ── Toast ──
  function showToast(msg, isErr = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' error' : '');
    setTimeout(() => t.className = 'toast', 3000);
  }

  // ── Admin logic ──
  function initAdmin() {
    const conversations = {}; // session_id → { name, email, messages: [] }
    let activeSession = null;

    const socket = io('/admin');
    const connDot  = document.getElementById('conn-dot');
    const statusTxt = document.getElementById('status-text');

    socket.on('connect', () => {
      connDot.style.background = '#4caf7d';
      connDot.style.boxShadow  = '0 0 6px #4caf7d';
      statusTxt.textContent = 'Connected';
    });
    socket.on('disconnect', () => {
      connDot.style.background = '#e07070';
      connDot.style.boxShadow  = '0 0 6px #e07070';
      statusTxt.textContent = 'Disconnected — refresh page';
    });

    // History on connect
    socket.on('history', (msgs) => {
      msgs.forEach(m => addMessage(m, false));
      renderSidebar();
    });

    // New real-time message
    socket.on('new_message', (m) => {
      addMessage(m, true);
    });

    function addMessage(m, isNew) {
      const sid = m.session_id;
      if (!conversations[sid]) {
        conversations[sid] = { name: m.name, email: m.email, messages: [], unread: false };
      }
      conversations[sid].messages.push({ from: 'visitor', text: m.message, time: m.timestamp });
      if (isNew) {
        conversations[sid].unread = true;
        showToast(`💬 New message from ${m.name}`);
      }
      renderSidebar();
      if (activeSession === sid) renderMessages();
    }

    function renderSidebar() {
      const list = document.getElementById('conversation-list');
      const keys = Object.keys(conversations);
      if (keys.length === 0) return;
      list.innerHTML = '';
      keys.slice().reverse().forEach(sid => {
        const c = conversations[sid];
        const last = c.messages[c.messages.length - 1];
        const div = document.createElement('div');
        div.className = 'conv-item' +
          (sid === activeSession ? ' active' : '') +
          (c.unread ? ' unread' : '');
        div.innerHTML = `
          <div class="conv-name">${escHtml(c.name)}</div>
          <div class="conv-preview">${escHtml(last.text)}</div>
          <div class="conv-time">${formatTime(last.time)}</div>`;
        div.addEventListener('click', () => selectConversation(sid));
        list.appendChild(div);
      });
    }

    function selectConversation(sid) {
      activeSession = sid;
      if (conversations[sid]) conversations[sid].unread = false;
      renderSidebar();
      renderChatArea();
      renderMessages();
      setTimeout(() => {
        const ta = document.getElementById('reply-input');
        if (ta) ta.focus();
      }, 50);
    }

    function renderChatArea() {
      const c = conversations[activeSession];
      const area = document.getElementById('chat-area');
      area.innerHTML = `
        <div class="chat-header-bar">
          <h2>${escHtml(c.name)}</h2>
          <p>${escHtml(c.email || 'No email provided')}</p>
        </div>
        <div id="messages-area"></div>
        <div class="reply-bar">
          <textarea id="reply-input" placeholder="Type your reply… (Enter to send)" rows="1"></textarea>
          <button id="reply-btn">Send</button>
        </div>`;

      const replyInput = document.getElementById('reply-input');
      const replyBtn   = document.getElementById('reply-btn');

      replyInput.addEventListener('input', () => {
        replyInput.style.height = 'auto';
        replyInput.style.height = Math.min(replyInput.scrollHeight, 120) + 'px';
      });
      replyInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
      });
      replyBtn.addEventListener('click', sendReply);

      function sendReply() {
        const text = replyInput.value.trim();
        if (!text || !activeSession) return;
        replyBtn.disabled = true;
        fetch('/api/admin/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: activeSession, message: text, password: ADMIN_PASSWORD })
        })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            conversations[activeSession].messages.push({ from: 'me', text, time: new Date().toISOString() });
            renderMessages();
            replyInput.value = '';
            replyInput.style.height = 'auto';
          } else {
            showToast('Failed to send reply', true);
          }
        })
        .catch(() => showToast('Network error', true))
        .finally(() => { replyBtn.disabled = false; replyInput.focus(); });
      }
    }

    function renderMessages() {
      const area = document.getElementById('messages-area');
      if (!area || !activeSession) return;
      const msgs = conversations[activeSession].messages;
      area.innerHTML = '';
      msgs.forEach(m => {
        const div = document.createElement('div');
        div.className = `msg-bubble ${m.from === 'me' ? 'me' : 'visitor'}`;
        div.innerHTML = `${escHtml(m.text)}<div class="msg-meta">${formatTime(m.time)}</div>`;
        area.appendChild(div);
      });
      area.scrollTop = area.scrollHeight;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function formatTime(iso) {
      try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
      catch { return ''; }
    }
  }
</script>
</body>
</html>
